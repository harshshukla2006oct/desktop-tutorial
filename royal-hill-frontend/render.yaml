databases:
  - name: royal-hill-db
    databaseName: royal_hill
    user: royal_hill
    plan: 0.1c-256mb
    region: singapore
    diskSizeGB: 1

services:
  - type: web
    name: royal-hill-storefront
    runtime: node
    rootDir: royal-hill-frontend
    plan: free
    region: singapore
    buildCommand: npm ci && npm run build
    startCommand: npm start
    healthCheckPath: /api/health
    envVars:
      - key: NODE_ENV
        value: production
      - key: DATABASE_URL
        fromDatabase:
          name: royal-hill-db
          property: connectionString
      - key: SESSION_SECRET
        generateValue: true
      - key: ADMIN_PASSWORD
        sync: false
